<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Project</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }
        .box {
            background: white;
            padding: 20px;
            margin: auto;
            width: 300px;
            border-radius: 10px;
        }
        button {
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>CI/CD Demo App</h1>
    <p id="msg">Click the button</p>
    <button onclick="changeText()">Click Me</button>
</div>

<script>
function changeText() {
    document.getElementById("msg").innerText = "CI/CD is working";
}
</script>

</body>
</html>
