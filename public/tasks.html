<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — DevOps TM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-hex"></div>
        <div>
          <h2>DEVOPS TM</h2>
          <div class="sidebar-version">v2.4.1-stable</div>
        </div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section-label">// NAVIGATION</div>
      <a href="javascript:void(0)" onclick="goTo('dashboard')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/>
          <rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>
        </svg>
        Dashboard
      </a>
      <a href="javascript:void(0)" onclick="goTo('tasks')" class="active">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 4h12M2 8h8M2 12h10" stroke-linecap="round"/>
        </svg>
        Tasks
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="pipeline-status">
        <span class="pipe-dot"></span>
        <span>Pipeline: RUNNING</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">

    <div class="page-header">
      <div>
        <div class="breadcrumb">/ TASKS</div>
        <h2>Task Management</h2>
      </div>
      <div id="taskCount" class="header-badge">0 ITEMS</div>
    </div>

    <!-- Add task -->
    <div class="task-box">
      <input type="text" id="taskInput" placeholder="describe your pipeline task…"
        onkeydown="if(event.key==='Enter')addTask()">
      <button onclick="addTask()">+ DEPLOY TASK</button>
    </div>

    <!-- Filter row -->
    <div class="filter-row">
      <button class="filter-btn active" id="f-all"       onclick="setFilter('all')">ALL</button>
      <button class="filter-btn"        id="f-pending"   onclick="setFilter('pending')">PENDING</button>
      <button class="filter-btn"        id="f-completed" onclick="setFilter('completed')">DONE</button>
    </div>

    <ul id="taskList"></ul>

    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">▣</div>
      NO TASKS IN QUEUE
    </div>

  </div>
</div>

<script src="script.js"></script>
<script>
// ✅ Smart navigation — works in Docker AND Live Server
function goTo(page) {
  const isLiveServer = window.location.port === '5500' || window.location.port === '5501';
  if (isLiveServer) {
    if (page === 'dashboard') window.location.href = 'dashboard.html';
    if (page === 'tasks')     window.location.href = 'tasks.html';
  } else {
    if (page === 'dashboard') window.location.href = '/dashboard';
    if (page === 'tasks')     window.location.href = '/tasks';
  }
}
let currentFilter = 'all';

function setFilter(f) {
  currentFilter = f;
  ['all','pending','completed'].forEach(k => {
    const btn = document.getElementById('f-' + k);
    btn.classList.toggle('active', k === f);
  });
  applyFilter();
}

function applyFilter() {
  const items = document.querySelectorAll('#taskList li');
  items.forEach(li => {
    const done = li.classList.contains('completed');
    if (currentFilter === 'all')       li.style.display = '';
    else if (currentFilter === 'pending')   li.style.display = done ? 'none' : '';
    else if (currentFilter === 'completed') li.style.display = done ? '' : 'none';
  });
}

// Watch task list for changes to update count + empty state
const observer = new MutationObserver(() => {
  const items = document.querySelectorAll('#taskList li');
  const count = items.length;
  const badge = document.getElementById('taskCount');
  if (badge) badge.textContent = count + ' ITEM' + (count !== 1 ? 'S' : '');
  document.getElementById('emptyState').style.display = count === 0 ? 'block' : 'none';
  applyFilter();
});
observer.observe(document.getElementById('taskList'), { childList: true });
</script>
</body>
</html>
